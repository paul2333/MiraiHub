# ---------------------------------------------------------------------------
# 计划升级等待代理的 nginx 片段（catch-all 站点版，宝塔等）
#
# 与 deploy/nginx-prod.conf 的关系：那个文件是「默认拒绝、显式放行」的严格模板；
# 本文件是给**已有 catch-all** 的站点补九个位置（一个命名 location + 四个精确
# location）。两者二选一注入同一个 server 块，否则 location 重定义会让 nginx -t 失败。
#
# 接入步骤：
#   1) 把本文件的 location @wb2api_upgrade_wait 放进站点的 server 块；
#   2) 在现有 location / 里加：
#        access_by_lua_file /www/wwwroot/workbuddy2api/deploy/upgrade-access.lua;
#   3) 把下面四个**精确** location 原样放进同一个 server 块（放在 location / 之外）。
#      精确匹配优先于前缀匹配，所以升级窗口内它们不会被 access_by_lua_file 排进
#      180 秒等待队列 —— 等待页和 reconnect.js 自己必须始终可用。
#      即使把 access_by_lua_file 提到 server 级，upgrade-access.lua 也会显式跳过
#      /__waiting/ 与 /api/app/ready：探针必须快速返回未就绪，不能排队。
#   4) 文件落位（等待页与脚本由 nginx 本地静态目录供应，不经上游）：
#        install -D -m 0644 deploy/waiting/index.html   <waiting-dir>/index.html
#        install -D -m 0644 deploy/waiting/reconnect.js <waiting-dir>/reconnect.js
#   5) nginx -t 通过后 reload；升级窗口开启时手工验证（见文件末尾）。
# ---------------------------------------------------------------------------

# 旧代不可用/升级窗口期间的排队代理（流式心跳、队列上限、原始状态转发都在它里面）。
location @wb2api_upgrade_wait {
    proxy_pass http://127.0.0.1:8791;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 660s;
    proxy_next_upstream off;
}

# 精确 /admin、/admin/：只有管理台文档导航在上游 502/503/504 时拿到中性等待页。
# 限流与代理头保持站点原有策略（按站点实际 zone 名替换 wb_admin）。
location = /admin {
    limit_req zone=wb_admin burst=30 nodelay;
    proxy_pass http://127.0.0.1:8790;
    include /etc/nginx/wb2api-proxy-headers.conf;
    proxy_intercept_errors on;
    error_page 502 503 504 =503 /__waiting/index.html;
}
location = /admin/ {
    limit_req zone=wb_admin burst=30 nodelay;
    proxy_pass http://127.0.0.1:8790;
    include /etc/nginx/wb2api-proxy-headers.conf;
    proxy_intercept_errors on;
    error_page 502 503 504 =503 /__waiting/index.html;
}

location = /__waiting/index.html {
    internal;
    if ($request_method !~ ^(GET|HEAD)$) {
        return 503;
    }
    add_header Cache-Control "no-store" always;
    add_header Retry-After 3 always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    types { text/html html; }
    default_type "text/html; charset=utf-8";
    alias <waiting-dir>/index.html;
}
location = /__waiting/reconnect.js {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    types { application/javascript js; }
    default_type application/javascript;
    alias <waiting-dir>/reconnect.js;
}

# 手工验证（在开启升级窗口、旧代已停的情况下执行）：
#   nginx -t -c /etc/nginx/nginx.conf
#   curl -sS -o /dev/null -w '%{http_code} %{content_type}\n' https://HOST/__waiting/reconnect.js
#       -> 200 application/javascript（必须 200，否则等待页无法重连）
#   curl -sS -D - -o /dev/null https://HOST/admin
#       -> HTTP/1.1 503 + Retry-After: 3 + Cache-Control: no-store
#   curl -sS -D - -o /dev/null https://HOST/api/app/version
#       -> 上游的真实状态（502/504 或 503 JSON），绝不能是 HTML 等待页
#   curl -sS -D - -o /dev/null https://HOST/api/app/ready
#       -> 503 {"ready": false}，且**立刻**返回（不被排进 180 秒队列）
#   curl -sS -D - -o /dev/null https://HOST/v1/models
#       -> 保持 JSON 协议与状态，不能被 HTML 错误页覆盖
